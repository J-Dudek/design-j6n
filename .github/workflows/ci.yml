name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call: # réutilisé par release.yml avant de publier un paquet

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: bash scripts/validate.sh

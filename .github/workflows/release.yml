name: Release

# Se déclenche sur un tag de version (ex. v1.2.0) : vérifie le projet, assemble
# un paquet téléchargeable (theme.css + theme.js + README + LICENCE) et publie
# une Release GitHub avec ce paquet en pièce jointe (zip + tar.gz).
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assembler le paquet
        run: bash scripts/package.sh

      - name: Publier la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: Foulée ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ env.PKG }}.zip
            ${{ env.PKG }}.tar.gz

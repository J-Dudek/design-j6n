name: Release

# Se déclenche sur un tag de version (ex. v1.2.0) : vérifie le projet, assemble
# un paquet téléchargeable (theme.css + theme.js + README + LICENCE), publie
# une Release GitHub avec ce paquet en pièce jointe (zip + tar.gz), et publie
# le paquet sur npm (version alignée sur le tag) via Trusted Publishing (OIDC) —
# aucun secret npm à stocker. Le "Trusted Publisher" doit être configuré une
# fois sur npmjs.com (package design-j6n → Settings → Trusted Publisher →
# GitHub Actions → org "J-Dudek", repo "design-j6n", workflow "release.yml").
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # requis par npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Assembler le paquet
        run: bash scripts/package.sh

      - name: Publier la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: Foulée ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ env.PKG }}.zip
            ${{ env.PKG }}.tar.gz

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publier sur npm
        run: |
          npm install -g npm@latest
          npm pkg set version="${GITHUB_REF_NAME#v}"
          npm publish --provenance
